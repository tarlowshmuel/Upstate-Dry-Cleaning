openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Dry cleaning order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all dry cleaning orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new dry cleaning order (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Edit any subset of an order's editable fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
        "404":
          description: Order not found
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /orders/{id}/paid:
    patch:
      operationId: updateOrderPaid
      tags: [orders]
      summary: Update order paid flag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPaidUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Order:
      type: object
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        phoneNumber:
          type: string
        name:
          type: string
        town:
          type: string
        colony:
          type: string
        colonyAddress:
          type: ["string", "null"]
        unitNumber:
          type: string
        gateAccess:
          type: ["string", "null"]
        items:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        cleanerTickets:
          type: ["string", "null"]
        pickupDate:
          type: ["string", "null"]
          format: date
        status:
          type: string
        paid:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orderNumber
        - phoneNumber
        - name
        - town
        - colony
        - unitNumber
        - status
        - paid
        - createdAt
    CreateOrderInput:
      type: object
      properties:
        name:
          type: string
        phoneNumber:
          type: string
        town:
          type: string
        colony:
          type: string
        colonyAddress:
          type: ["string", "null"]
        unitNumber:
          type: string
        gateAccess:
          type: ["string", "null"]
        items:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        pickupDate:
          type: ["string", "null"]
          format: date
      required:
        - name
        - phoneNumber
        - town
        - colony
        - unitNumber
    UpdateOrderInput:
      type: object
      description: All fields optional; only provided fields are updated.
      properties:
        name:
          type: string
        phoneNumber:
          type: string
        town:
          type: string
        colony:
          type: string
        colonyAddress:
          type: ["string", "null"]
        unitNumber:
          type: string
        gateAccess:
          type: ["string", "null"]
        items:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        pickupDate:
          type: ["string", "null"]
          format: date
    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderPaidUpdate:
      type: object
      properties:
        paid:
          type: boolean
      required:
        - paid
