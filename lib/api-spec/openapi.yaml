openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Dry cleaning order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /towns:
    get:
      operationId: listTowns
      tags: [orders]
      summary: List service towns with their pickup schedule
      responses:
        "200":
          description: List of towns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Town"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all dry cleaning orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new dry cleaning order (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Edit any subset of an order's editable fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
        "404":
          description: Order not found
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Permanently delete an order (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Order deleted
        "404":
          description: Order not found
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /orders/bulk-mark-at-cleaners:
    post:
      operationId: bulkMarkOrdersAtCleaners
      tags: [orders]
      summary: Mark every picked_up order as at_cleaners in one transaction
      description: |
        Atomically transitions every order currently in `picked_up` to
        `at_cleaners`. Orders not in `picked_up` are ignored (no rewind risk).
        Fires the same customer notification side effect as the per-order
        PATCH path for each updated order. Hit this when the driver drops the
        whole load on the cleaners' counter.
      responses:
        "200":
          description: Summary of what changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkStatusUpdateResult"
  /orders/bulk-mark-delivered:
    post:
      operationId: bulkMarkOrdersDelivered
      tags: [orders]
      summary: Mark every ready order as delivered in one transaction
      description: |
        Atomically transitions every order currently in `ready` to `delivered`.
        Orders not in `ready` are ignored. Fires per-order customer notifications.
        Hit this after the drop-off route is complete.
      responses:
        "200":
          description: Summary of what changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkStatusUpdateResult"
  /orders/bulk-mark-ready:
    post:
      operationId: bulkMarkOrdersReady
      tags: [orders]
      summary: Mark every at_cleaners order as ready in one transaction
      description: |
        Atomically transitions every order currently in `at_cleaners` to
        `ready`. Orders not in `at_cleaners` are ignored (no rewind risk).
        Fires the same customer notification side effect as the per-order
        PATCH path for each updated order.
      responses:
        "200":
          description: Summary of what changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkStatusUpdateResult"
  /orders/{id}/paid:
    patch:
      operationId: updateOrderPaid
      tags: [orders]
      summary: Update order paid flag and optional payment method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPaidUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /orders/{id}/line-items:
    get:
      operationId: getOrderLineItems
      tags: [orders]
      summary: Get an order's line items + computed totals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order pricing snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPricing"
        "404":
          description: Order not found
    put:
      operationId: replaceOrderLineItems
      tags: [orders]
      summary: Replace an order's line items (auto-sends a fresh receipt by default)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceLineItemsInput"
      responses:
        "200":
          description: Updated order + lines + totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceLineItemsResult"
        "404":
          description: Order not found
  /orders/{id}/send-receipt:
    post:
      operationId: sendOrderReceipt
      tags: [orders]
      summary: Manually re-send the outstanding receipt SMS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "409":
          description: Cannot send receipt (not priced, or send failed)
  /price-list:
    get:
      operationId: listPriceList
      tags: [price-list]
      summary: List price-list items
      responses:
        "200":
          description: All price-list items (active + inactive)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceListItem"
    post:
      operationId: createPriceListItem
      tags: [price-list]
      summary: Add a new price-list item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListItem"
        "409":
          description: Duplicate name
  /price-list/{id}:
    patch:
      operationId: updatePriceListItem
      tags: [price-list]
      summary: Edit a price-list item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListItem"
        "404":
          description: Not found
    delete:
      operationId: deactivatePriceListItem
      tags: [price-list]
      summary: Soft-delete (deactivate) a price-list item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListItem"
        "404":
          description: Not found
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get pricing/business settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update one or more settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /earnings:
    get:
      operationId: getEarnings
      tags: [earnings]
      summary: Earnings report for a period (today/week/month/all)
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, week, month, all]
      responses:
        "200":
          description: Earnings report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsReport"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Town:
      type: object
      properties:
        name:
          type: string
        pickupDay:
          type: string
          description: Day of week the driver picks up here (e.g. "Monday")
        dropoffDay:
          type: string
        nextPickupDate:
          type: ["string", "null"]
          format: date
          description: The next scheduled pickup date for this town (YYYY-MM-DD), respecting the midnight-before cutoff
      required:
        - name
        - pickupDay
        - dropoffDay
    Order:
      type: object
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        phoneNumber:
          type: string
        name:
          type: string
        town:
          type: string
        colony:
          type: string
        colonyAddress:
          type: ["string", "null"]
        unitNumber:
          type: string
        gateAccess:
          type: ["string", "null"]
        items:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        cleanerTickets:
          type: ["string", "null"]
        pickupDate:
          type: ["string", "null"]
          format: date
        status:
          type: string
        paid:
          type: boolean
        pricedAt:
          type: ["string", "null"]
          format: date-time
        feeCentsSnapshot:
          type: ["integer", "null"]
        totalOverrideCents:
          type: ["integer", "null"]
        totalWasOverridden:
          type: boolean
        receiptSentAt:
          type: ["string", "null"]
          format: date-time
        paidAt:
          type: ["string", "null"]
          format: date-time
        paidMethod:
          type: ["string", "null"]
        paidConfirmationSentAt:
          type: ["string", "null"]
          format: date-time
        itemsSubtotalCents:
          type: ["integer", "null"]
          description: Sum of line items (quantity × unit price). Null if not yet priced.
        grandTotalCents:
          type: ["integer", "null"]
          description: itemsSubtotalCents + feeCentsSnapshot, or totalOverrideCents when set. Null if not yet priced.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orderNumber
        - phoneNumber
        - name
        - town
        - colony
        - unitNumber
        - status
        - paid
        - totalWasOverridden
        - createdAt
    CreateOrderInput:
      type: object
      properties:
        name:
          type: string
        phoneNumber:
          type: string
        town:
          type: string
        colony:
          type: string
        colonyAddress:
          type: ["string", "null"]
        unitNumber:
          type: string
        gateAccess:
          type: ["string", "null"]
        items:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        pickupDate:
          type: ["string", "null"]
          format: date
      required:
        - name
        - phoneNumber
        - town
        - colony
        - unitNumber
    UpdateOrderInput:
      type: object
      description: All fields optional; only provided fields are updated.
      properties:
        name:
          type: string
        phoneNumber:
          type: string
        town:
          type: string
        colony:
          type: string
        colonyAddress:
          type: ["string", "null"]
        unitNumber:
          type: string
        gateAccess:
          type: ["string", "null"]
        items:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        pickupDate:
          type: ["string", "null"]
          format: date
    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderPaidUpdate:
      type: object
      properties:
        paid:
          type: boolean
        paidMethod:
          type: ["string", "null"]
          enum: [zelle, cash, null]
      required:
        - paid
    PriceListItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        priceCents:
          type: integer
        active:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, priceCents, active, sortOrder, createdAt, updatedAt]
    PriceListInput:
      type: object
      properties:
        name:
          type: string
        priceCents:
          type: integer
        active:
          type: boolean
        sortOrder:
          type: integer
    Settings:
      type: object
      properties:
        feeCents:
          type: integer
        orderMinimumCents:
          type: integer
        wholesalePercent:
          type: integer
      required: [feeCents, orderMinimumCents, wholesalePercent]
    SettingsInput:
      type: object
      properties:
        feeCents:
          type: integer
        orderMinimumCents:
          type: integer
        wholesalePercent:
          type: integer
    OrderLineItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        priceListId:
          type: ["integer", "null"]
        itemName:
          type: string
        quantity:
          type: integer
        unitPriceCents:
          type: integer
        isOverride:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, orderId, itemName, quantity, unitPriceCents, isOverride, sortOrder, createdAt]
    OrderTotals:
      type: object
      properties:
        itemsSubtotalCents:
          type: integer
        feeCents:
          type: integer
        grandTotalCents:
          type: integer
        isOverridden:
          type: boolean
      required: [itemsSubtotalCents, feeCents, grandTotalCents, isOverridden]
    OrderPricing:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
        totals:
          $ref: "#/components/schemas/OrderTotals"
        isPriced:
          type: boolean
      required: [lines, totals, isPriced]
    LineItemInput:
      type: object
      properties:
        priceListId:
          type: ["integer", "null"]
        itemName:
          type: string
        quantity:
          type: integer
        unitPriceCents:
          type: integer
        isOverride:
          type: boolean
        sortOrder:
          type: integer
      required: [itemName, quantity, unitPriceCents]
    ReplaceLineItemsInput:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineItemInput"
        totalOverrideCents:
          type: ["integer", "null"]
        sendReceipt:
          type: boolean
      required: [lines]
    ReplaceLineItemsResult:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
        totals:
          $ref: "#/components/schemas/OrderTotals"
        receiptSent:
          type: boolean
        receiptSkippedReason:
          type: string
      required: [order, lines, totals, receiptSent]
    EarningsByDay:
      type: object
      properties:
        date:
          type: string
        count:
          type: integer
        revenueCents:
          type: integer
      required: [date, count, revenueCents]
    EarningsReport:
      type: object
      properties:
        period:
          type: string
        orderCount:
          type: integer
        grossRevenueCents:
          type: integer
        feesCollectedCents:
          type: integer
        itemsRevenueCents:
          type: integer
        paidCents:
          type: integer
        outstandingCents:
          type: integer
        profitEstimateCents:
          type: integer
        wholesalePercent:
          type: integer
        byMethod:
          type: object
          properties:
            zelle:
              type: integer
            cash:
              type: integer
            unknown:
              type: integer
          required: [zelle, cash, unknown]
        byRouteDay:
          type: array
          items:
            $ref: "#/components/schemas/EarningsByDay"
      required:
        - period
        - orderCount
        - grossRevenueCents
        - feesCollectedCents
        - itemsRevenueCents
        - paidCents
        - outstandingCents
        - profitEstimateCents
        - wholesalePercent
        - byMethod
        - byRouteDay
    BulkStatusUpdateResult:
      type: object
      properties:
        updated:
          type: integer
          description: Count of orders whose status was changed
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
          description: The orders that were updated
      required:
        - updated
        - orders
